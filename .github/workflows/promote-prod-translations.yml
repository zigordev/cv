name: Promote Prod Translations

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/messages/**/*.json'
      - 'docker/.env.app.prod'
      - 'apps/web/tolgee.config.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-prod-translations
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Tolgee promotion settings
        env:
          TOLGEE_SYNC_API_URL: ${{ vars.TOLGEE_SYNC_API_URL }}
          TOLGEE_SYNC_API_KEY: ${{ secrets.TOLGEE_SYNC_API_KEY }}
        run: |
          required=(
            TOLGEE_SYNC_API_URL
            TOLGEE_SYNC_API_KEY
          )

          for name in "${required[@]}"; do
            value="$(printenv "$name" || true)"
            if [ -z "$value" ]; then
              echo "Missing required production translation setting: $name" >&2
              exit 1
            fi
          done

      - name: Load TOLGEE_PROJECT_ID from docker/.env.app.prod
        run: |
          set -euo pipefail

          APP_ENV_FILE="docker/.env.app.prod"
          project_id="$(grep -E '^TOLGEE_PROJECT_ID=' "$APP_ENV_FILE" | tail -n1 | cut -d'=' -f2- || true)"

          if [ -z "$project_id" ]; then
            echo "Missing required key in $APP_ENV_FILE: TOLGEE_PROJECT_ID" >&2
            exit 1
          fi

          echo "TOLGEE_PROJECT_ID=$project_id" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Promote committed snapshots into prod Tolgee
        env:
          TOLGEE_API_URL: ${{ vars.TOLGEE_SYNC_API_URL }}
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_SYNC_API_KEY }}
          TOLGEE_PROJECT_ID: ${{ env.TOLGEE_PROJECT_ID }}
        run: |
          set -uo pipefail

          for attempt in 1 2 3; do
            if npm run i18n:push -w @cv/web; then
              exit 0
            fi
            echo "Promotion attempt $attempt failed" >&2
            sleep $((attempt * 20))
          done

          echo 'Every promotion attempt failed; prod Tolgee still holds the previous copy.' >&2
          exit 1

      - name: Open or update an issue when the promotion fails
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Translations: promotion to prod Tolgee failing';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The committed message files were not promoted to the production Tolgee project.',
              '',
              'Production keeps serving the copy Tolgee already held, so every render still',
              'counts `source="merged"` and `CopyServedFromRepository` will not fire for this.',
              'The wording in `apps/web/messages` is live only once this succeeds.',
              '',
              `[Failed run](${run}) · [Runbook](https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/i18n-fallback.md)`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'all',
              labels: 'translations',
              per_page: 20,
            });
            const issue = existing.data.find((candidate) => candidate.title === title);

            if (!issue) {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: ['translations'],
              });
              return;
            }

            if (issue.state === 'closed') {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: 'open',
              });
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body,
            });

      - name: Close the issue once the promotion succeeds
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Translations: promotion to prod Tolgee failing';
            const open = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'translations',
              per_page: 20,
            });
            const issue = open.data.find((candidate) => candidate.title === title);
            if (!issue) return;

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: 'The copy reached prod Tolgee again. Closing.',
            });
            await github.rest.issues.update({
              ...context.repo,
              issue_number: issue.number,
              state: 'closed',
            });
