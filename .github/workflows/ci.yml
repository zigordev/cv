name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: HUSKY=0 npm ci

      - name: Format check
        run: npm run format:check

      - name: Vendored kit parity
        run: npm run check:kit -- --offline

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:cov

      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-web
          path: apps/web/coverage
          retention-days: 7
          if-no-files-found: warn

      - name: Build
        run: npm run build

  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false

  web-smoke:
    name: Web Smoke (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build web image
        run: docker build -f apps/web/Dockerfile --target prod --build-arg NEXT_PUBLIC_RELEASE=ci -t cv-web:ci .

      # The container normally boots through openbao-run, which needs the ops
      # stack. CI has no OpenBao, so the smoke test runs the server directly:
      # it proves the image serves the CV, not that secrets wiring works.
      - name: Run container
        run: |
          docker run -d --name cv-web -p 3001:3001 cv-web:ci node apps/web/server.js
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "web is up"; exit 0
            fi
            sleep 2
          done
          echo "web did not become healthy" >&2
          docker logs cv-web >&2
          exit 1

      - name: Smoke probes
        run: |
          set -euo pipefail
          health="$(curl -sf http://localhost:3001/health)"
          grep -q '"status":"ok"' <<<"$health"
          body="$(curl -sf http://localhost:3001/)"
          # The CV must be readable in the server-rendered HTML, not only after
          # hydration — this is what keeps it indexable and printable.
          for needle in "Curriculum vitae" "Experience" "Skills" "Education"; do
            grep -qF "$needle" <<<"$body" || { echo "missing: $needle" >&2; exit 1; }
          done
          # Without an API key the question endpoint must answer 503 and the
          # header must not offer the box, whatever the flag says.
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' \
            -d '{"question":"Kafka?","locale":"en"}' http://localhost:3001/api/ask)"
          [ "$status" = "503" ] || { echo "expected 503 from /api/ask without a key, got $status" >&2; exit 1; }
          grep -qF 'cv-ask-question' <<<"$body" && { echo "the question box rendered without a key" >&2; exit 1; }
          # The monthly budget lives on a volume mounted at /var/lib/cv. The
          # image runs as `node`, so the directory has to be writable by that
          # user or the budget silently never persists.
          docker exec cv-web sh -c 'touch /var/lib/cv/.writable && rm /var/lib/cv/.writable'
          docker exec cv-web sh -c 'test "$(stat -c %U /var/lib/cv)" = node'
          metrics="$(curl -sf http://localhost:3001/metrics)"
          grep -q '^cv_ask_budget_used_ratio ' <<<"$metrics"

      - name: Container logs (on failure)
        if: failure()
        run: docker logs cv-web || true

      - name: Stop container
        if: always()
        run: docker rm -f cv-web || true

  e2e-a11y:
    name: E2E, accessibility and performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The estate's pilot for Playwright, axe and performance budgets. cv is the
    # smallest public surface and the one product whose whole job is being read
    # by someone else, so it is where the rules get proven before they move to
    # gpool, kini and the operator console.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: HUSKY=0 npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Build
        run: npm run build

      # Playwright starts the server itself, so there is no compose step and no
      # port to keep in sync between the workflow and the config.
      - name: Run accessibility and performance suite
        run: npm run e2e
        working-directory: apps/web

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-web
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  compose-validation:
    name: Compose Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate compose manifests
        env:
          NEXT_PUBLIC_RELEASE: ci
          OPENBAO_TOKEN: ci-openbao-token
          TOLGEE_PROJECT_ID: '3'
          WEB_IMAGE: cv-web:ci
        run: |
          docker compose -f docker/compose.app.dev.yml config > /dev/null
          docker compose -f docker/compose.app.local.yml config > /dev/null
          docker compose -f docker/compose.app.prod.yml config > /dev/null

  security-supply-chain:
    name: Security + Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: HUSKY=0 npm ci

      # A copyleft licence arriving through a transitive dependency can oblige
      # you to publish source you never intended to. Checked on every build
      # because the dangerous moment is when a licence *changes*.
      - name: Licence check (prod dependencies)
        run: node ./scripts/check-licences.mjs .

      - name: Audit dependencies (prod only, high+)
        run: npm run audit:prod:gate

      - name: Build prod image
        run: docker build --build-arg NEXT_PUBLIC_RELEASE=ci -f apps/web/Dockerfile --target prod -t cv-web:ci .

      - name: Prepare artifacts dir
        run: mkdir -p artifacts

      - name: Generate SBOM (web image)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: cv-web:ci
          format: spdx-json
          output-file: artifacts/sbom-cv-web.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SBOM file
        run: |
          test -s artifacts/sbom-cv-web.spdx.json
          jq -e '.spdxVersion and (.packages | type == "array")' artifacts/sbom-cv-web.spdx.json

      - name: Upload SBOM (web image)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-web
          path: artifacts/sbom-cv-web.spdx.json
          retention-days: 30
          if-no-files-found: error

      # Twice on purpose: the JSON run records what was found and never fails,
      # so the artifact exists even when the gate below stops the build. The
      # vulnerability database is cached after the first scan.
      - name: Trivy report (web image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cv-web:ci
          format: json
          output: artifacts/trivy-cv-web.json
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Upload Trivy report (web image)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-web
          path: artifacts/trivy-cv-web.json
          retention-days: 30
          if-no-files-found: error

      - name: Trivy scan (web image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cv-web:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan
        run: |
          semgrep scan \
            --config p/default \
            --config p/secrets \
            --exclude-rule dockerfile.security.missing-user.missing-user \
            --exclude-rule dockerfile.security.missing-user-entrypoint.missing-user-entrypoint \
            --exclude-rule yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service \
            --exclude-rule yaml.docker-compose.security.no-new-privileges.no-new-privileges \
            --exclude-rule bash.lang.security.ifs-tampering.ifs-tampering \
            --exclude-rule generic.secrets.security.detected-generic-secret.detected-generic-secret \
            --exclude-rule javascript.lang.security.audit.prototype-pollution.prototype-pollution-loop.prototype-pollution-loop \
            --exclude-rule javascript.lang.security.audit.incomplete-sanitization.incomplete-sanitization \
            --exclude-rule javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp \
            --exclude-rule terraform.aws.security.aws-subnet-has-public-ip-address.aws-subnet-has-public-ip-address \
            --error \
            --metrics=off
