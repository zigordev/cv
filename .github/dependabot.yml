version: 2

# Grouped and weekly on purpose: a daily stream of single-package PRs is
# noise that gets ignored, which is the same outcome as having no updates.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    # Wait a week before proposing a newly published version. A compromised
    # release is usually caught and yanked within days, and nothing here is
    # urgent enough to be worth being the first to install it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must move together — a version skew between them
      # breaks JSX typing (this exact failure is why this group exists: PR #9
      # bumped react alone, to 19, while react-dom sat separately at 18 in
      # PR #7). Ungrouped because it's a major bump, which neither
      # dev-dependencies nor production-patch below covers.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patch:
        dependency-type: production
        update-types: [patch]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    # Wait a week before proposing a newly published version. A compromised
    # release is usually caught and yanked within days, and nothing here is
    # urgent enough to be worth being the first to install it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
